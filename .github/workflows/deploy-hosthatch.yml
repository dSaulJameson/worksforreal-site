name: Deploy to HostHatch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worksforreal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install and verify
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build

      - name: Package deployment source
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.vinext \
            --exclude=.wrangler \
            --exclude=dist \
            --exclude='.env*' \
            --exclude='*ed25519*' \
            -czf "/tmp/worksforreal-${GITHUB_SHA}.tgz" .

      - name: Configure SSH access
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.HOSTHATCH_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ vars.HOSTHATCH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/hosthatch_deploy
          chmod 600 ~/.ssh/hosthatch_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOSTHATCH_HOST: ${{ vars.HOSTHATCH_HOST }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/hosthatch_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            "/tmp/worksforreal-${GITHUB_SHA}.tgz" \
            "deploy@${HOSTHATCH_HOST}:/tmp/worksforreal-${GITHUB_SHA}.tgz"

      - name: Activate release
        env:
          HOSTHATCH_HOST: ${{ vars.HOSTHATCH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hosthatch_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            "deploy@${HOSTHATCH_HOST}" \
            "sudo /usr/local/sbin/deploy-worksforreal /tmp/worksforreal-${GITHUB_SHA}.tgz ${GITHUB_SHA}"
