<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — Execution Associates</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px}main{width:min(100%,440px);border-top:4px solid #d4af37;padding-top:28px}.brand{display:block;width:min(100%,360px);height:auto;margin:0 0 40px}h1{font-size:clamp(36px,7vw,52px);letter-spacing:-.05em;line-height:1.05;margin:0 0 18px}p{font-size:16px;line-height:1.6;color:#cccccc}label{display:block;font-size:15px;margin:32px 0 10px}input,button{font:inherit;width:100%;border-radius:4px;padding:16px}input{background:#161616;border:1px solid #666666;color:white}input:focus{outline:2px solid #e4c65b;outline-offset:3px}button{margin-top:16px;border:0;background:#d4af37;color:#080808;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}small{display:block;font-size:14px;line-height:1.5;margin-top:28px;color:#b6b6b6}#status{min-height:52px}a{color:#e4c65b}</style></head>
<body><main><img class="brand" src="/brand.png" alt="Execution Associates" width="6000" height="1774"><p>Private workspace</p><h1>Your workspace.<br>Your inbox.</h1><p>Sign in with your approved email address. We’ll send you a secure link—no password needed.</p><form id="login"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" required maxlength="254"><button id="submit" type="submit">Email me a sign-in link</button></form><p id="status" role="status" aria-live="polite"></p><small>Access is by invitation only. Your sign-in link expires in 10 minutes.</small></main><script src="/login.js" defer></script></body></html>
