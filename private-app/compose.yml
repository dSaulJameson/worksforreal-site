name: execution-private
services:
  gateway:
    build: .
    image: execution-private-gateway:${EXECUTION_IMAGE_TAG:-local}
    container_name: execution-private-gateway
    restart: unless-stopped
    env_file: /opt/execution-private/runtime.env
    ports: ["127.0.0.1:3022:3000"]
    volumes: ["auth-data:/data", "shared-mail:/mail/shared"]
    depends_on:
      mailflare: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  mailflare:
    image: execution-mailflare:${MAILFLARE_REVISION:?required}
    container_name: execution-mail-shared
    restart: unless-stopped
    environment:
      APP_URL: https://app.execution.associates
      SMTP_INBOUND_PORT: "0"
      CF_SEND_TOKEN: ${CF_MAIL_TOKEN:?required}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:?required}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:?required}
    volumes: ["shared-mail:/data"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  auth-data:
  shared-mail:
